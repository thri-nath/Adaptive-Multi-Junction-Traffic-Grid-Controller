<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 608" width="874" height="608" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>traffic_system_top block diagram</title>
<desc>Clock and reset logic feeds a synchronized domain containing the emergency controller, Junction A, the green-wave delay, Junction B and the shared pedestrian arbiter.</desc>
<defs>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#2B2B29}
.t{font-size:13px;font-weight:700}
.s{font-size:11px}
.l{font-size:10.5px;fill:#52514E}
.i{font-style:italic}
.m{text-anchor:middle}
.e{text-anchor:end}
.gy{fill:#444441}
.tl{fill:#085041}
.pu{fill:#3C3489}
.am{fill:#633806}
.rd{fill:#A32D2D}
</style>
</defs>

<rect width="874" height="608" fill="#FFFFFF"/>

<!-- top-level boundary -->
<rect x="136" y="12" width="602" height="512" rx="18" fill="none" stroke="#9A9893" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="150" y="31" class="t">traffic_system_top</text>

<!-- clock and reset logic -->
<rect x="156" y="46" width="562" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="437" y="65" class="t m gy">Clock and reset logic</text>
<text x="437" y="82" class="s m gy">reset_sync + input_sync</text>
<text x="437" y="98" class="l m">2-FF input synchronizers; reset asserts asynchronously, releases synchronously</text>

<!-- band to synchronized domain -->
<line x1="437" y1="112" x2="437" y2="149" stroke="#6B6A66" stroke-width="1.4" marker-end="url(#aG)"/>
<text x="447" y="127" class="l">clk, rst_n_sync</text>
<text x="447" y="141" class="l">synchronized sens_*, ped_req_*, emergency_in</text>

<!-- synchronized domain -->
<rect x="146" y="150" width="582" height="358" rx="12" fill="#F8F7F4"/>
<text x="158" y="167" class="l i">synchronized domain</text>

<!-- emergency controller -->
<rect x="298" y="178" width="278" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="437" y="199" class="t m pu">emergency_controller</text>
<text x="437" y="218" class="s m pu">emergency_active · HOLD_CYCLES</text>

<!-- emergency_active output and bus -->
<line x1="578" y1="207" x2="746" y2="207" stroke="#A32D2D" stroke-width="1.4" marker-end="url(#aR)"/>
<line x1="437" y1="238" x2="437" y2="268" stroke="#A32D2D" stroke-width="1.4"/>
<line x1="211" y1="268" x2="663" y2="268" stroke="#A32D2D" stroke-width="1.4"/>
<line x1="211" y1="268" x2="211" y2="297" stroke="#A32D2D" stroke-width="1.4" marker-end="url(#aR)"/>
<line x1="437" y1="268" x2="437" y2="297" stroke="#A32D2D" stroke-width="1.4" marker-end="url(#aR)"/>
<line x1="663" y1="268" x2="663" y2="297" stroke="#A32D2D" stroke-width="1.4" marker-end="url(#aR)"/>
<line x1="278" y1="268" x2="278" y2="430" stroke="#A32D2D" stroke-width="1.4" marker-end="url(#aR)"/>
<circle cx="437" cy="268" r="2.5" fill="#A32D2D"/>
<circle cx="278" cy="268" r="2.5" fill="#A32D2D"/>
<text x="447" y="257" class="l i rd">emergency_active</text>

<!-- Junction A -->
<rect x="156" y="298" width="110" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="211" y="320" class="t m tl">Junction A</text>
<text x="211" y="338" class="s m tl">junction_fsm</text>
<text x="211" y="355" class="s m tl">IS_MASTER = 1</text>

<!-- green_wave_delay -->
<rect x="374" y="298" width="126" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="437" y="326" class="t m am" style="font-size:12.5px">green_wave_delay</text>
<text x="437" y="346" class="s m am">DELAY_CYCLES</text>

<!-- Junction B -->
<rect x="608" y="298" width="110" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="663" y="320" class="t m tl">Junction B</text>
<text x="663" y="338" class="s m tl">junction_fsm</text>
<text x="663" y="355" class="s m tl">IS_MASTER = 0</text>

<!-- green-wave path -->
<line x1="268" y1="336" x2="372" y2="336" stroke="#854F0B" stroke-width="1.4" marker-end="url(#aA)"/>
<text x="290" y="327" class="l">green_wave_out</text>
<line x1="502" y1="336" x2="606" y2="336" stroke="#854F0B" stroke-width="1.4" marker-end="url(#aA)"/>
<text x="554" y="327" class="l m">green_wave_trigger</text>

<!-- shared pedestrian arbiter -->
<rect x="156" y="432" width="562" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="437" y="453" class="t m pu">shared_pedestrian_arbiter</text>
<text x="437" y="471" class="s m pu">Round-robin, no starvation</text>
<text x="437" y="487" class="l m">1-bit priority state: prio_sel</text>

<!-- arbiter handshakes -->
<line x1="176" y1="432" x2="176" y2="376" stroke="#534AB7" stroke-width="1.4" marker-end="url(#aP)"/>
<text x="182" y="397" class="l">grant_A</text>
<line x1="256" y1="376" x2="256" y2="430" stroke="#534AB7" stroke-width="1.4" marker-end="url(#aP)"/>
<text x="250" y="415" class="l e">ped_done_A</text>
<line x1="698" y1="432" x2="698" y2="376" stroke="#534AB7" stroke-width="1.4" marker-end="url(#aP)"/>
<text x="692" y="397" class="l e">grant_B</text>
<line x1="618" y1="376" x2="618" y2="430" stroke="#534AB7" stroke-width="1.4" marker-end="url(#aP)"/>
<text x="624" y="415" class="l">ped_done_B</text>

<!-- external inputs (left) -->
<rect x="6" y="44" width="120" height="20" rx="4" fill="#FCFCFB" stroke="#B5B4AE" stroke-width="0.8"/>
<text x="66" y="58" class="l m">clk, rst_n</text>
<line x1="126" y1="54" x2="154" y2="54" stroke="#6B6A66" stroke-width="1.4" marker-end="url(#aG)"/>
<rect x="6" y="72" width="120" height="64" rx="4" fill="#FCFCFB" stroke="#B5B4AE" stroke-width="0.8"/>
<text x="66" y="86" class="l m i">async inputs</text>
<text x="66" y="100" class="l m">emergency_in</text>
<text x="66" y="114" class="l m">sens_*</text>
<text x="66" y="128" class="l m">ped_req_*</text>
<line x1="126" y1="100" x2="154" y2="100" stroke="#6B6A66" stroke-width="1.4" marker-end="url(#aG)"/>

<!-- Junction A outputs (left) -->
<rect x="6" y="301" width="120" height="22" rx="4" fill="#FCFCFB" stroke="#B5B4AE" stroke-width="0.8"/>
<text x="66" y="316" class="l m">light_A_NS[2:0]</text>
<line x1="156" y1="312" x2="128" y2="312" stroke="#6B6A66" stroke-width="1.4" marker-end="url(#aG)"/>
<rect x="6" y="325" width="120" height="22" rx="4" fill="#FCFCFB" stroke="#B5B4AE" stroke-width="0.8"/>
<text x="66" y="340" class="l m">light_A_EW[2:0]</text>
<line x1="156" y1="336" x2="128" y2="336" stroke="#6B6A66" stroke-width="1.4" marker-end="url(#aG)"/>
<rect x="6" y="349" width="120" height="22" rx="4" fill="#FCFCFB" stroke="#B5B4AE" stroke-width="0.8"/>
<text x="66" y="364" class="l m">ped_walk_A[1:0]</text>
<line x1="156" y1="360" x2="128" y2="360" stroke="#6B6A66" stroke-width="1.4" marker-end="url(#aG)"/>

<!-- Junction B outputs (right) -->
<rect x="748" y="301" width="120" height="22" rx="4" fill="#FCFCFB" stroke="#B5B4AE" stroke-width="0.8"/>
<text x="808" y="316" class="l m">light_B_NS[2:0]</text>
<line x1="718" y1="312" x2="746" y2="312" stroke="#6B6A66" stroke-width="1.4" marker-end="url(#aG)"/>
<rect x="748" y="325" width="120" height="22" rx="4" fill="#FCFCFB" stroke="#B5B4AE" stroke-width="0.8"/>
<text x="808" y="340" class="l m">light_B_EW[2:0]</text>
<line x1="718" y1="336" x2="746" y2="336" stroke="#6B6A66" stroke-width="1.4" marker-end="url(#aG)"/>
<rect x="748" y="349" width="120" height="22" rx="4" fill="#FCFCFB" stroke="#B5B4AE" stroke-width="0.8"/>
<text x="808" y="364" class="l m">ped_walk_B[1:0]</text>
<line x1="718" y1="360" x2="746" y2="360" stroke="#6B6A66" stroke-width="1.4" marker-end="url(#aG)"/>

<!-- emergency_active top-level output -->
<rect x="748" y="195" width="120" height="24" rx="4" fill="#FCFCFB" stroke="#B5B4AE" stroke-width="0.8"/>
<text x="808" y="211" class="l m">emergency_active</text>

<!-- legend -->
<rect x="156" y="539" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="174" y="549" class="l">Clock and reset logic</text>
<rect x="316" y="539" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="334" y="549" class="l">Junction FSM instance</text>
<rect x="488" y="539" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="506" y="549" class="l">Green-wave delay</text>
<rect x="636" y="539" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="654" y="549" class="l">Shared, single instance</text>

<!-- footnotes -->
<text x="6" y="572" class="l">sens_* = sens_A_NS, sens_A_EW, sens_B_NS, sens_B_EW.   ped_req_* = ped_req_A_NS, ped_req_A_EW, ped_req_B_NS, ped_req_B_EW.</text>
<text x="6" y="587" class="l">Light outputs are {G,Y,R}; ped_walk bit 1 = NS crossing, bit 0 = EW crossing.</text>
<text x="6" y="602" class="l">The per-FSM state outputs and prio_sel are observation outputs and are not drawn.</text>
</svg>
