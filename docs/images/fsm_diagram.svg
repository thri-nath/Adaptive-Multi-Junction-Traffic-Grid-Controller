<svg xmlns="http://www.w3.org/2000/svg" width="680" height="592" viewBox="0 0 680 592" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Traffic controller FSM with nine states</title>
<desc>Six-state normal cycle between north-south and east-west, with pedestrian and sync wait states branching from S_AR_EW2NS, an emergency state reachable from any state, and reset and invalid-state recovery both landing on S_AR_EW2NS.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.g rect,.fg{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.g .th{fill:#444441}
.g .ts{fill:#5F5E5A}
.p rect,.fp{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.p .th{fill:#3C3489}
.p .ts{fill:#534AB7}
.n{fill:#FFFFFF;stroke:#888780;stroke-width:.5;stroke-dasharray:4 3}
</style>
</defs>
<rect width="680" height="592" fill="#FFFFFF"/>

<line x1="388" y1="156" x2="142" y2="156" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="265" y="146" text-anchor="middle">timer_done</text>

<path class="arr" d="M415 130 V56 H327" marker-end="url(#arrow)"/>
<text class="ts" x="371" y="48" text-anchor="middle">ped_req</text>
<path class="arr" d="M205 56 H118 V128" marker-end="url(#arrow)"/>
<text class="ts" x="162" y="48" text-anchor="middle">ped_done</text>

<path class="arr" d="M415 182 V256 H327" marker-end="url(#arrow)"/>
<text class="ts" x="371" y="248" text-anchor="middle">sync_req</text>
<path class="arr" d="M205 256 H118 V184" marker-end="url(#arrow)"/>
<text class="ts" x="162" y="248" text-anchor="middle">sync_done</text>

<line x1="62" y1="182" x2="62" y2="328" class="arr" marker-end="url(#arrow)"/>
<line x1="62" y1="382" x2="62" y2="428" class="arr" marker-end="url(#arrow)"/>
<line x1="140" y1="456" x2="388" y2="456" class="arr" marker-end="url(#arrow)"/>
<line x1="455" y1="430" x2="455" y2="384" class="arr" marker-end="url(#arrow)"/>
<line x1="455" y1="330" x2="455" y2="184" class="arr" marker-end="url(#arrow)"/>

<circle cx="580" cy="145" r="6" fill="#5F5E5A"/>
<line x1="574" y1="145" x2="512" y2="145" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="543" y="136" text-anchor="middle">reset</text>

<path class="arr" stroke-dasharray="4 3" d="M540 46 H480 V128" marker-end="url(#arrow)"/>
<text class="ts" x="510" y="38" text-anchor="middle">default</text>

<path class="arr" d="M600 210 V170 H512" marker-end="url(#arrow)"/>
<text class="ts" x="555" y="188" text-anchor="middle">!emergency</text>

<line x1="600" y1="330" x2="600" y2="264" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="608" y="300">emergency</text>

<g class="g">
<rect x="20" y="130" width="120" height="52" rx="8"/>
<text class="th" x="80" y="148" text-anchor="middle" dominant-baseline="central">S_NS_GREEN</text>
<text class="ts" x="80" y="166" text-anchor="middle" dominant-baseline="central">4'b0000</text>
</g>
<g class="g">
<rect x="20" y="330" width="120" height="52" rx="8"/>
<text class="th" x="80" y="348" text-anchor="middle" dominant-baseline="central">S_NS_YELLOW</text>
<text class="ts" x="80" y="366" text-anchor="middle" dominant-baseline="central">4'b0001</text>
</g>
<g class="g">
<rect x="20" y="430" width="120" height="52" rx="8"/>
<text class="th" x="80" y="448" text-anchor="middle" dominant-baseline="central">S_AR_NS2EW</text>
<text class="ts" x="80" y="466" text-anchor="middle" dominant-baseline="central">4'b0010</text>
</g>
<g class="g">
<rect x="390" y="430" width="120" height="52" rx="8"/>
<text class="th" x="450" y="448" text-anchor="middle" dominant-baseline="central">S_EW_GREEN</text>
<text class="ts" x="450" y="466" text-anchor="middle" dominant-baseline="central">4'b0011</text>
</g>
<g class="g">
<rect x="390" y="330" width="120" height="52" rx="8"/>
<text class="th" x="450" y="348" text-anchor="middle" dominant-baseline="central">S_EW_YELLOW</text>
<text class="ts" x="450" y="366" text-anchor="middle" dominant-baseline="central">4'b0100</text>
</g>
<g class="g">
<rect x="390" y="130" width="120" height="52" rx="8"/>
<text class="th" x="450" y="148" text-anchor="middle" dominant-baseline="central">S_AR_EW2NS</text>
<text class="ts" x="450" y="166" text-anchor="middle" dominant-baseline="central">4'b0101</text>
</g>

<g class="p">
<rect x="205" y="30" width="120" height="52" rx="8"/>
<text class="th" x="265" y="48" text-anchor="middle" dominant-baseline="central">S_PED</text>
<text class="ts" x="265" y="66" text-anchor="middle" dominant-baseline="central">4'b0110</text>
</g>
<g class="p">
<rect x="205" y="230" width="120" height="52" rx="8"/>
<text class="th" x="265" y="248" text-anchor="middle" dominant-baseline="central">S_WAIT_SYNC</text>
<text class="ts" x="265" y="266" text-anchor="middle" dominant-baseline="central">4'b0111</text>
</g>
<g class="p">
<rect x="540" y="210" width="120" height="52" rx="8"/>
<text class="th" x="600" y="228" text-anchor="middle" dominant-baseline="central">S_EMERGENCY</text>
<text class="ts" x="600" y="246" text-anchor="middle" dominant-baseline="central">4'b1000</text>
</g>

<rect class="n" x="540" y="20" width="120" height="52" rx="8"/>
<text class="th" x="600" y="38" text-anchor="middle" dominant-baseline="central">Invalid state</text>
<text class="ts" x="600" y="56" text-anchor="middle" dominant-baseline="central">4'b1001–4'b1111</text>

<rect class="n" x="540" y="330" width="120" height="52" rx="8"/>
<text class="th" x="600" y="348" text-anchor="middle" dominant-baseline="central">Any state</text>
<text class="ts" x="600" y="366" text-anchor="middle" dominant-baseline="central">except emergency</text>

<rect class="fg" x="20" y="516" width="14" height="14" rx="3"/>
<text class="ts" x="42" y="524" dominant-baseline="central">Normal sequence</text>
<rect class="fp" x="170" y="516" width="14" height="14" rx="3"/>
<text class="ts" x="192" y="524" dominant-baseline="central">Special modes</text>
<rect class="n" x="310" y="516" width="14" height="14" rx="3" stroke-dasharray="3 2"/>
<text class="ts" x="332" y="524" dominant-baseline="central">Notation only, not a state</text>
<text class="ts" x="20" y="552">Unlabelled arrows fire on timer_done. Wait self-loops are omitted.</text>
<text class="ts" x="20" y="570">Priority: emergency, then ped_req, then sync_req, then normal sequence.</text>
</svg>
